<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <title>Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-sky-400 via-blue-300 to-indigo-400 flex justify-center items-center min-h-screen">

<div class="bg-white w-[340px] p-6 rounded-3xl shadow-2xl border border-gray-200">
    <div class=" mb-[15px] font-semibold">
        <h1>Calculator</h1>
    </div>
    <!-- Display -->
    <input
        id="display"
        type="text"
        readonly
        placeholder="0"
        class="w-full h-20 rounded-2xl bg-gray-200 text-right text-4xl font-semibold px-4 outline-none shadow-inner mb-6"
    >

    <!-- Buttons -->
    <div class="grid grid-cols-4 gap-4">

        <button class="btn bg-red-500 text-white">C</button>
        <button class="btn bg-amber-400">⌫</button>
        <button class="btn operator">/</button>
        <button class="btn operator">*</button>

        <button class="btn number text-blue-600 bg-gray-200 ">7</button>
        <button class="btn number text-blue-600 bg-gray-200">8</button>
        <button class="btn number text-blue-600 bg-gray-200">9</button>
        <button class="btn operator">-</button>

        <button class="btn number text-blue-600 bg-gray-200 ">4</button>
        <button class="btn number text-blue-600 bg-gray-200">5</button>
        <button class="btn number text-blue-600 bg-gray-200">6</button>
        <button class="btn operator ">+</button>

        <button class="btn number text-blue-600 bg-gray-200">1</button>
        <button class="btn number text-blue-600 bg-gray-200">2</button>
        <button class="btn number text-blue-600 bg-gray-200">3</button>
        <button class="btn equal row-span-2">=</button>

        <button class="btn number col-span-2 text-blue-600 bg-gray-200">0</button>
        <button class="btn number text-blue-600 bg-gray-200">.</button>

    </div>

</div>
<script src="index.js"></script>

</body>
</html>
